apiVersion: apps/v1
kind: Deployment

metadata:
  name: rf-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rf-app

  template:
    metadata:
      labels:
        app: rf-app

    spec:
      containers:
      - name: rf-container
        image: rf-app:latest

        ports:
        - containerPort: 80